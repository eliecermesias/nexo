name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  production-not-configured:
    name: Production environment pending
    runs-on: ubuntu-latest

    steps:
      - name: Deployment is not configured yet
        run: |
          echo "Production deployment is intentionally disabled."
          echo "Configure a hosting target, environment secrets, and deployment commands before enabling CD."
